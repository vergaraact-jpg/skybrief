name: Compilar APK SkyBrief

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias y sincronizar
        run: |
          npm ci || npm install
          node copy-www.js
          npx cap sync android

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permisos de ejecucion a Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk ./SkyBrief.apk

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: SkyBrief-debug-apk
          path: ./SkyBrief.apk
          if-no-files-found: error

      - name: Publicar Release directa en GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "SkyBrief para Android v1.0.0"
          body: |
            ### 📱 SkyBrief - App Nativa para Android
            Descarga e instala directamente el archivo `.apk` en tu móvil.
            
            - ✨ Clima en tiempo real y calidad del aire.
            - 🚶/🚗 Selector de movilidad y estilismo diario.
            - 🗺️ Mapa interactivo Leaflet.
            - ⏰ Alarma matutina con notificaciones nativas en segundo plano.
          files: ./SkyBrief.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
