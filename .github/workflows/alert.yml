name: Enviar Notificacion Matutina

on:
  schedule:
    # 06:00 UTC corresponde a las 07:00 / 08:00 en España según horario estacional
    - cron: '0 6 * * *'
    # Vigilancia de tormentas: cada 2 horas entre las 07:00 y las 21:00 UTC (solo avisa si hay riesgo)
    - cron: '30 7-21/2 * * *'
  workflow_dispatch: # Botón manual para ejecutar pruebas al instante

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ejecutar script de notificación
        run: node notify.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # El cron de vigilancia solo envía alerta si hay riesgo de tormenta
          MODE: ${{ github.event.schedule == '30 7-21/2 * * *' && 'storm' || 'daily' }}
